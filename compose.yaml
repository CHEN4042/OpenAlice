services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: openalice
      POSTGRES_USER: openalice
      POSTGRES_PASSWORD: openalice
    ports:
      - "5432:5432"
    volumes:
      - openalice-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openalice -d openalice"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  openalice-postgres:
